<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>preview</title><link rel="stylesheet" href="styles.css"></head>
<body><main style="padding:16px">
<section class="card" id="sec-schedule"><div id="scheduleList"></div></section>
</main>
<script>
const COLORS = ['#ff6b4a', '#14b8a6', '#a855f7', '#ffb020', '#3b82f6', '#ec4899'];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const days = [
  { day: 'Ngày 1 (17/10)', items: [
    { time: '08:00', activity: 'Tập trung, khởi hành', place: 'Sảnh công ty', note: 'Có mặt trước 15 phút' },
    { time: '12:00', activity: 'Ăn trưa', place: 'Ăn trưa (Cơm Niêu Việt Xưa - chi nhánh Tràng An)' },
    { time: '13:30', activity: 'Tham quan Tràng An' },
    { time: '16:30', activity: 'Lên xe về HomeStay' },
    { time: '18:30', activity: 'Ăn tối (Ăn Dê)' },
  ]},
  { day: 'Ngày 2 (18/10)', items: [
    { time: 'Buổi sáng', activity: 'Tự túc' },
    { time: '11:00', activity: 'Trả phòng , đi ăn phở bát đá' },
    { time: '12:00', activity: 'Về Hà Nội' },
  ]},
];
document.getElementById('scheduleList').innerHTML = days.map((d, i) => `<div class="day" style="--c:${COLORS[i % COLORS.length]}">
  <h3 class="day-head"><span class="num">${i + 1}</span>${esc(d.day)}</h3>
  <ol class="timeline">
    ${d.items.map(s => `<li>
      <time>${esc(s.time)}</time>
      <div class="tl-body">
        <b>${esc(s.activity || s.place)}</b>
        ${s.activity && s.place ? `<p class="muted">📍 ${esc(s.place)}</p>` : ''}
        ${s.note ? `<p>💡 ${esc(s.note)}</p>` : ''}
      </div>
    </li>`).join('')}
  </ol>
</div>`).join('');
</script></body></html>
